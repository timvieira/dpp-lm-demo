name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (DPP maths)
        run: node --test tests/dpp.test.mjs tests/dpp-reference.test.mjs tests/orderings.test.mjs tests/usage-lib.test.mjs
      - name: Assemble site
        # Scripts and styles go under a per-commit folder, so a reload never mixes a new page
        # with stale cached code (Pages lets browsers reuse files for 10 minutes).
        run: |
          V="v-${GITHUB_SHA::8}"
          mkdir -p "_site/$V" _site/lab
          cp -r index.html data _site/
          cp -r css js lab "_site/$V/"
          # The lab prototypes: each page at a stable address, its script beside the versioned js it imports.
          for f in lab/*.html; do
            cp "$f" _site/lab/
            s=$(basename "$f" .html)
            sed -i "s#src=\"$s.js\"#src=\"../$V/lab/$s.js\"#" "_site/lab/$s.html"
            grep -q "$V/lab/$s.js" "_site/lab/$s.html"
          done
          sed -i "s#href=\"css/style.css\"#href=\"$V/css/style.css\"#; s#src=\"js/main.js\"#src=\"$V/js/main.js\"#" _site/index.html
          grep -q "$V/js/main.js" _site/index.html && grep -q "$V/css/style.css" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
